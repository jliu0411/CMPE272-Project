name: REMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build with placeholder frontend configuration
        run: npm run build
        env:
          VITE_API_URL: https://rems-api-xa86.onrender.com
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

  backend:
    name: Backend health check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m unittest discover -s tests -v
      - name: Check GET /health with placeholder configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient

          from app.main import app

          with TestClient(app) as client:
              response = client.get("/health")

          assert response.status_code == 200, response.text
          assert response.json() == {"status": "ok", "service": "REMS API"}
          PY

  terraform:
    name: Terraform (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Render
            directory: infrastructure/terraform
            config_file: render.tf
          - name: Netlify
            directory: infrastructure/terraform/netlify
            config_file: netifly.tf
    env:
      TF_IN_AUTOMATION: 'true'
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.target.directory }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Check Terraform files and formatting
        env:
          TF_CONFIG_FILE: ${{ matrix.target.config_file }}
        run: |
          if [[ ! -f "$TF_CONFIG_FILE" ]]; then
            echo "::error::Missing $TF_CONFIG_FILE in $PWD. Commit the Terraform configuration before running CI."
            exit 1
          fi
          terraform fmt -check -diff
      - name: Initialize providers and modules
        run: terraform init -backend=false -input=false -no-color
      - name: Validate configuration
        run: terraform validate -no-color

  terraform-apply:
    name: Terraform plan and apply (Render then Netlify)
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.TF_CLOUD_ORGANIZATION != ''
    needs: [frontend, backend, terraform]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: rems-terraform-production
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: 'true'
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_app_terraform_io }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - name: Plan and apply Render
        working-directory: infrastructure/terraform
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_OWNER_ID: ${{ vars.RENDER_OWNER_ID }}
        run: |
          terraform init -input=false -no-color
          if [[ "$(terraform state list render_web_service.rems_api)" != render_web_service.rems_api ]]; then
            echo '::error::Migrate the existing Render Terraform state before deploying.'
            exit 1
          fi
          terraform plan -input=false -no-color -lock-timeout=5m -out="$RUNNER_TEMP/render.tfplan"
          terraform apply -input=false -no-color -lock-timeout=5m "$RUNNER_TEMP/render.tfplan"
      - name: Plan and apply Netlify
        working-directory: infrastructure/terraform/netlify
        env:
          NETLIFY_API_TOKEN: ${{ secrets.NETLIFY_API_TOKEN }}
          TF_VAR_netlify_team_id: ${{ vars.NETLIFY_TEAM_ID }}
          TF_VAR_supabase_url: ${{ vars.SUPABASE_URL }}
          TF_VAR_supabase_publishable_key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          terraform init -input=false -no-color
          if [[ "$(terraform state list netlify_site_build_settings.rems_frontend)" != netlify_site_build_settings.rems_frontend ]]; then
            echo '::error::Migrate the existing Netlify Terraform state before deploying.'
            exit 1
          fi
          terraform plan -input=false -no-color -lock-timeout=5m -out="$RUNNER_TEMP/netlify.tfplan"
          terraform apply -input=false -no-color -lock-timeout=5m "$RUNNER_TEMP/netlify.tfplan"
